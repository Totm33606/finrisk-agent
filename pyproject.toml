[project]
name = "finrisk-agent"
version = "0.1.0"
description = "AI-Driven Credit Scoring & Agentic Financial Decisioning — LightGBM risk model exposed via FastMCP, orchestrated by a Langfuse-traced LangChain ReAct agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Thomas", email = "thomas@example.com" }]
license = { text = "MIT" }

dependencies = [
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.2",
    "pyarrow>=17.0.0",
    "numpy>=1.26.4",
    "shap>=0.46.0",
    "matplotlib>=3.9.2",
    "fastmcp>=2.3.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "langchain>=0.3.7,<0.4.0",
    "langchain-openai>=0.2.6,<0.3.0",
    "langgraph>=0.2.45,<0.3.0",
    "langgraph-prebuilt>=0.2.0,<0.3.0",
    "langchain-mcp-adapters>=0.0.9,<0.1.0",
    "langfuse>=2.53.9,<3.0.0",
    "fastapi>=0.115.4",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.1",
    "joblib>=1.4.2",
    "optuna>=4.0.0",
    "typer>=0.13.0",
    # Pinned to 2.x: `ml_pipeline.tracking` targets the 2.x model-logging
    # signature (`log_model(model, artifact_path=...)`), which MLflow 3
    # reworked. Note this constrains pandas to <3 transitively.
    "mlflow>=2.17,<3.0.0",
    # langchain-mcp-adapters puts no upper bound on mcp itself, but only
    # supports its 1.x client API — mcp 2.0 renamed streamablehttp_client to
    # streamable_http_client and breaks agent.py's import. Pinned directly
    # since nothing else constrains it.
    "mcp<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "pandas-stubs>=2.2.2",
]

[project.scripts]
finrisk-train = "ml_pipeline.train:app"
finrisk-eval = "ml_pipeline.eval:app"
# `:cli`, not `:main` — typer's @command decorator returns the plain function,
# so a console script pointing at `main` would run with hardcoded defaults and
# silently ignore --transport/--host/--port/--alias.
finrisk-mcp = "mcp_server.server:cli"
finrisk-agent = "agent.agent:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "N803",   # X (function args) — same sklearn convention as N806
    "N806",   # X / X_train / X_test — standard scikit-learn convention
    "UP042",  # `class Foo(str, Enum)` — intentional, gives JSON-serializable enums
]

[tool.mypy]
# Pinned to 3.12 (not the 3.11 floor of requires-python) because numpy's
# bundled .pyi stubs use PEP 695 `type` statements that mypy can only parse
# when targeting 3.12+ — unrelated to which interpreter actually runs the
# code. Do not "align" this with requires-python; it will break on numpy's
# stubs.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship no py.typed marker / stub package, so mypy can't
# analyze their types. Scoped narrowly (not a global ignore_missing_imports)
# to keep --strict meaningful everywhere else.
module = [
    "joblib",
    "shap",
    "sklearn.*",
    "langfuse",
    "langfuse.callback",
    "langchain_mcp_adapters.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=src --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipeline", "src/mcp_server", "src/agent", "src/common"]
